# =============================================================================
#  Telegraf: puente MQTT → InfluxDB (SmartMine)
# =============================================================================

[agent]
  omit_hostname = true
  skip_processors_after_aggregators = true
  flush_interval = "2s"

# --- Entrada: telemetría desde el broker MQTT --------------------------------
[[inputs.mqtt_consumer]]
  # Dentro de Docker: nombre del servicio, no localhost
  servers = ["tcp://mosquitto:1883"]
  topics = ["smartmine/+/+/telemetria"]

  # QoS 1 + sesión persistente: el broker guarda los mensajes si Telegraf cae
  qos = 1
  client_id = "smartmine-telegraf"
  persistent_session = true

  # Formato del payload según docs/MQTT_TOPICS.md
  data_format = "json"
  json_time_key = "timestamp"
  json_time_format = "unix_ms"
  json_string_fields = ["modo_operacion"]

  # El topic completo es redundante tras el parsing
  tagexclude = ["topic"]

  # smartmine/<modulo>/<device_id>/telemetria
  # Módulo → medición · Dispositivo → etiqueta device_id
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "smartmine/+/+/telemetria"
    measurement = "_/measurement/_/_"
    tags = "_/_/device_id/_"

# --- Salida: InfluxDB 2.x ----------------------------------------------------
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"