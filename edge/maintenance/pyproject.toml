[project]
name = "maintenance"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JeSuSd1524", email = "jesusdavid.calvente083@alu.uhu.es" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "smartmine-common",
]

[project.scripts]
maintenance = "maintenance.main:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
smartmine-common = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
notebook = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
]
