services:

  # --- Broker MQTT ---------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartmine-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - "./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"
      - "mosquitto_data:/mosquitto/data"
    healthcheck:
      # Si consigue publicar, el broker está vivo (topic fuera de smartmine/#)
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck/mosquitto", "-m", "ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Base de datos de históricos -----------------------------------------
  influxdb:
    image: influxdb:2.7
    container_name: smartmine-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - "influxdb_data:/var/lib/influxdb2"
      - "influxdb_config:/etc/influxdb2"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s   # La configuración inicial tarda unos segundos

  # --- Puente MQTT → InfluxDB ----------------------------------------------
  telegraf:
    image: telegraf:1.34
    container_name: smartmine-telegraf
    restart: unless-stopped
    environment:
      # Izquierda: nombres que pide telegraf.conf · Derecha: valores del .env
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - "./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro"
    depends_on:
      # Arranca solo cuando ambos estén sanos, no solo arrancados
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy

# --- Volúmenes con nombre ----------------------------------------------------
volumes:
  mosquitto_data:
  influxdb_data:
  influxdb_config: