services:

  # --- Broker MQTT ---------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartmine-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - "./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"
      - "mosquitto_data:/mosquitto/data"

  # --- Base de datos de históricos ------------------------------------------
  influxdb:
    image: influxdb:2.7
    container_name: smartmine-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - "influxdb_data:/var/lib/influxdb2"
      - "influxdb_config:/etc/influxdb2"

# --- Volúmenes con nombre -----------------------------------------------------
volumes:
  mosquitto_data:
  influxdb_data:
  influxdb_config: