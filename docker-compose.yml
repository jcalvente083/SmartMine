services:

  # --- Broker MQTT ---------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smartmine-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - "./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"
      - "mosquitto_data:/mosquitto/data"
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "healthcheck/mosquitto", "-m", "ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Base de datos de históricos -----------------------------------------
  influxdb:
    image: influxdb:2.7
    container_name: smartmine-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - "influxdb_data:/var/lib/influxdb2"
      - "influxdb_config:/etc/influxdb2"
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s   

  # --- Puente MQTT → InfluxDB ----------------------------------------------
  telegraf:
    image: telegraf:1.34
    container_name: smartmine-telegraf
    restart: unless-stopped
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - "./infra/telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro"
    depends_on:
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy

  # --- Nodo Edge: Mantenimiento Predictivo ------------------------------------
  edge-maintenance:
    build:
      context: ./edge
      dockerfile: maintenance/Dockerfile
    image: smartmine/edge-maintenance:dev
    container_name: smartmine-edge-maintenance
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_CLIENT_ID: edge-mantenimiento
      NODE_ID: nodo-mantenimiento
      MACHINE_IDS: trituradora-01,cinta-02,molino-03
      TICK_INTERVAL_S: "1.0"
    volumes:
      - "maintenance_state:/app/data"
    depends_on:
      mosquitto:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    stop_grace_period: 5s

# --- Volúmenes con nombre ----------------------------------------------------
volumes:
  mosquitto_data:
  influxdb_data:
  influxdb_config:
  maintenance_state: